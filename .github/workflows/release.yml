name: build-afterglow-binaries

on:
  workflow_dispatch:
    inputs:
      codex_tag:
        description: OpenAI Codex tag to patch and build
        required: true
        default: rust-v0.136.0
      codex_commit:
        description: Optional exact OpenAI Codex commit to verify
        required: false
        default: 7ca611348db9446711ed16ed81c84095e3721cee
      patch_version:
        description: Afterglow patch/release version
        required: true
        default: 0.1.0-alpha.0
      create_draft_release:
        description: Create a draft GitHub release after artifacts build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            binary: codex
            asset_ext: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binary: codex
            asset_ext: ""
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: codex
            asset_ext: ""
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: codex
            asset_ext: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: codex.exe
            asset_ext: ".exe"
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: codex.exe
            asset_ext: ".exe"
    steps:
      - name: Free Linux runner disk space
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Checkout Afterglow
        uses: actions/checkout@v4

      - name: Checkout OpenAI Codex
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ inputs.codex_tag }}
          path: upstream-codex

      - name: Verify Codex commit if requested
        if: ${{ inputs.codex_commit != '' }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C upstream-codex rev-parse HEAD)
          test "$actual" = "${{ inputs.codex_commit }}"

      - name: Apply Afterglow patch
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-codex apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/codex-tui-compact-aware-render/codex-tui-compact-aware-render.patch"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install requested Rust target for active toolchain
        shell: bash
        working-directory: upstream-codex/codex-rs
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          rustup show active-toolchain
          rustup target list --installed

      - name: Offline effectiveness tests
        shell: bash
        working-directory: upstream-codex/codex-rs
        run: |
          set -euo pipefail
          cargo test -p codex-tui compact_aware -- --nocapture
          cargo test -p codex-tui compact_rebuild -- --nocapture
          cargo test -p codex-core compact_aware -- --nocapture
          cargo test -p codex-core config_schema -- --nocapture

      - name: Free offline test build artifacts before Linux release build
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        working-directory: upstream-codex/codex-rs
        run: |
          set -euxo pipefail
          df -h .
          cargo clean
          df -h .

      - name: Install Zig for Linux musl release build
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.0
          use-cache: false

      - name: Configure Linux musl release toolchain
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/upstream-codex/.github/scripts/install-musl-build-tools.sh"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure OpenAI Codex rusty_v8 artifacts
        if: ${{ contains(matrix.target, 'unknown-linux-musl') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(python3 "${GITHUB_WORKSPACE}/upstream-codex/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          archive_path="${binding_dir}/librusty_v8_release_${TARGET}.a.gz"
          binding_path="${binding_dir}/src_binding_release_${TARGET}.rs"
          checksums_path="${binding_dir}/rusty_v8_release_${TARGET}.sha256"
          mkdir -p "${binding_dir}"
          curl -fsSL --retry 10 --retry-connrefused "${base_url}/librusty_v8_release_${TARGET}.a.gz" -o "${archive_path}"
          curl -fsSL --retry 10 --retry-connrefused "${base_url}/src_binding_release_${TARGET}.rs" -o "${binding_path}"
          curl -fsSL --retry 10 --retry-connrefused "${base_url}/rusty_v8_release_${TARGET}.sha256" -o "${checksums_path}"
          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${binding_dir}" && sha256sum -c "${checksums_path}")
          else
            (cd "${binding_dir}" && shasum -a 256 -c "${checksums_path}")
          fi
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Build Codex CLI
        shell: bash
        working-directory: upstream-codex/codex-rs
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CARGO_INCREMENTAL=0
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          cargo build --release -p codex-cli --target "${{ matrix.target }}" --bin codex

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          cp "upstream-codex/codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/bin/${{ matrix.binary }}"

      - name: Package raw release binary
        shell: bash
        run: |
          set -euo pipefail
          asset="codex-afterglow-${{ inputs.codex_tag }}-${{ matrix.target }}${{ matrix.asset_ext }}"
          cp "dist/bin/${{ matrix.binary }}" "dist/$asset"
          node scripts/package-release.mjs --asset "dist/$asset" --target-triple "${{ matrix.target }}" --binary-name "${{ matrix.binary }}" --codex-tag "${{ inputs.codex_tag }}" --patch-version "${{ inputs.patch_version }}"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: afterglow-${{ matrix.target }}
          path: |
            dist/codex-afterglow-*
            dist/metadata/*.json

  manifest:
    name: generate manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Collect metadata
        run: |
          mkdir -p dist/metadata dist/assets
          find downloaded-artifacts -name '*.asset.json' -exec cp {} dist/metadata/ \;
          find downloaded-artifacts -type f -name 'codex-afterglow-*' ! -name '*.json' -exec cp {} dist/assets/ \;
          node scripts/generate-release-manifest.mjs --metadata-dir dist/metadata --out dist/afterglow.release.json
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: afterglow-release-bundle
          path: |
            dist/assets/*
            dist/afterglow.release.json
            dist/metadata/*.json

  draft-release:
    name: create draft release
    runs-on: ubuntu-latest
    needs: manifest
    if: ${{ inputs.create_draft_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afterglow-release-bundle
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "afterglow-v${{ inputs.patch_version }}" dist/assets/* dist/afterglow.release.json --repo "${GITHUB_REPOSITORY}" --draft --title "Codex Afterglow ${{ inputs.patch_version }}" --notes "Draft binary release. Verify docs/release-trust.md before publishing. Codex Afterglow is an unofficial companion workaround, not an official OpenAI release."

